<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Footer | Birthday Gift</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div class="phone-shell">
        <div class="app-screen">
          <div class="app-shell">
            <section class="theme-page">
              <header class="theme-header reasons-header">
                <a class="theme-icon-button back-icon-button" href="./home.html" aria-label="Back to home">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14.5 5.5 8 12l6.5 6.5"></path>
                    <path d="M9 12h7"></path>
                  </svg>
                </a>
                <h1 class="theme-title">♡ Birthday Gift ♡</h1>
                <a class="profile-badge profile-slot" href="./profile.html" aria-label="Profile">
                  <span class="placeholder-icon profile-placeholder">♡</span>
                  <img class="profile-image profile-image-badge" data-default-src="./images/profile.jpg" src="./images/profile.jpg" alt="Profile" />
                </a>
              </header>
              <main class="theme-main page-content">
                <div class="placeholder-copy">
                  <h2>Shared Footer</h2>
                  <p>This file mirrors the reusable footer used across the inner pages.</p>
                </div>
              </main>
              <nav class="theme-footer" aria-label="Footer navigation">
                <a class="footer-link is-active" href="./home.html">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 10.5 12 4l8 6.5"></path>
                    <path d="M6 9.8V20h12V9.8"></path>
                  </svg>
                  <span>Home</span>
                </a>
                <a class="footer-link" href="./affirmations.html">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 19.5s-6.5-3.9-6.5-9A4 4 0 0 1 12 7.3a4 4 0 0 1 6.5 3.2c0 5.1-6.5 9-6.5 9z"></path>
                  </svg>
                  <span>Affirmations</span>
                </a>
                <a class="footer-link" href="./messages.html">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 6.5h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-5 4v-4H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"></path>
                  </svg>
                  <span>Messages</span>
                </a>
                <a class="footer-link" href="./memories.html">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="5.5" width="16" height="13" rx="2"></rect>
                    <path d="M8 9.5h.01"></path>
                    <path d="m5.5 17 4.2-4.1 3.1 3 2.2-2.1 3.5 3.2"></path>
                  </svg>
                  <span>Memories</span>
                </a>
              </nav>
            </section>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
